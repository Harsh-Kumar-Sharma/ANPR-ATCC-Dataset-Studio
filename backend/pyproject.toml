[project]
name = "anpr-atcc-backend"
version = "0.1.0"
description = "Backend for ANPR + ATCC Dataset Studio"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "opencv-python-headless>=4.10",
    # Pinned, and deliberately not floating: ultralytics pulls torch in
    # transitively and pip will happily satisfy that with a "+cpu" wheel,
    # which is how this project ended up running detection on the CPU
    # without anyone choosing to.
    #
    # These pins fix the VERSION but cannot get you the CUDA BUILD - those
    # wheels are not on PyPI. Install requirements-gpu.txt first; it
    # carries the index URL and the uninstall-first caveat.
    "torch==2.14.0",
    "torchvision==0.29.0",
    "ultralytics>=8.4",
    "trackers>=2.6",
    "rapidocr>=3.9",
    "onnxruntime>=1.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

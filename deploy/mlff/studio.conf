# studio.highwaynetra.in -> ANPR-ATCC Dataset Studio.
#
# INSTALLED AT: /app/mlff-node/nginx/sites/studio.conf on the GPU server,
# picked up by this line in BOTH /app/mlff-node/nginx/http.conf.template
# and https.conf.template (MLFF regenerates conf.d from those every six
# hours, so anything written straight into conf.d disappears):
#
#     include /etc/nginx/mlff/sites/*.conf;
#
# This copy in the Studio repo is the source of truth. MLFF's repo is
# pulled and redeployed by people who do not know Studio exists; if the
# templates are ever replaced wholesale, the include line goes, Studio
# becomes unreachable by domain and MLFF carries on. Re-add the include
# line to both templates and reload - see deploy/README.md.
#
# RULES - this file is loaded into a live production nginx:
#   * Never `default_server`, never an IP in server_name. MLFF's LAN LiDAR
#     devices post to http://<ip>/api/ with no matching Host header; they
#     must keep landing on MLFF's default server.
#   * No auth here. Basic auth lives in Studio's own nginx so that every
#     route in (this one, IP:port, loopback) passes through it.
#   * Reload only, after `nginx -t`:
#       docker exec mlff-node-nginx sh /etc/nginx/mlff/start.sh reload
#
# The upstream is Studio's web container as published on the host
# (port 8090), reached through MLFF's Docker network gateway. The stacks
# share no network on purpose, so neither can block the other's
# `compose up/down`. If MLFF's network is ever recreated on a different
# subnet, update the address below:
#     docker network inspect mlff-node_default --format '{{range .IPAM.Config}}{{.Gateway}}{{end}}'
# Studio down means 502 for this hostname only; MLFF is unaffected.

server {
    listen 80;
    server_name studio.highwaynetra.in;

    # Let's Encrypt HTTP-01, shared with MLFF's certbot (which also
    # renews this certificate).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        # HTTPS SWITCH, step 2 of 2 - only once port 443 is open at the
        # firewall AND studio-https.conf is enabled. Uncommenting this
        # while 443 is closed takes Studio off the air by every route.
        # return 301 https://$host$request_uri;

        include /etc/nginx/mlff/sites/studio-proxy.inc;
    }
}

# Studio's own nginx (the studio-web container).
#
# Every way in lands here - the domain (proxied by MLFF's nginx, see
# deploy/mlff/), http://<server-ip>:8090/ directly, and loopback - so
# basic auth lives HERE and covers everything. Do not move it into
# MLFF's config: the IP:port route would walk straight past it.
#
#   /       the built React app (desktop/dist, built with VITE_API_BASE=/api)
#   /api/*  the FastAPI backend, /api prefix stripped

server {
    listen 80;
    server_name _;

    # One switch for the whole site: static files and /api alike.
    auth_basic "ANPR-ATCC Dataset Studio";
    auth_basic_user_file /etc/nginx/htpasswd/.htpasswd;

    root /usr/share/nginx/html;
    index index.html;

    # Resolve the backend per request rather than once at startup, so
    # this nginx starts (and keeps answering 401/502) even while the
    # backend container is down or being rebuilt.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend backend:8000;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # The browser's credentials are for this nginx, not for FastAPI.
    proxy_set_header Authorization "";
    proxy_connect_timeout 30s;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    client_max_body_size 50m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Live RTSP preview, polled continuously. Unbuffered or it lags by
    # seconds; X-Frame-Sequence (read by LivePreview.tsx) passes through
    # untouched because nothing here hides upstream headers.
    location ~ ^/api(/processing-runs/[^/]+/rtsp/preview\.jpg)$ {
        proxy_pass http://$backend$1$is_args$args;
        proxy_buffering off;
        proxy_cache off;
        access_log off;
    }

    # Source video: a FileResponse that honours Range, which the <video>
    # element depends on. Range goes upstream and 206 comes back as-is.
    location ~ ^/api(/projects/[^/]+/sources/[^/]+/video)$ {
        proxy_pass http://$backend$1$is_args$args;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
    }

    # Dataset archive: a zip streamed as it is built, deliberately never
    # staged on disk. Can run for minutes on a large dataset.
    location ~ ^/api(/dataset-versions/[^/]+/archive)$ {
        proxy_pass http://$backend$1$is_args$args;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://$backend;
    }

    location = /api {
        return 404;
    }

    # Hashed build assets never change under the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single page, no client-side router.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
